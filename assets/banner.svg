<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #f8fafc;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-12px) scale(1.02); }
      }
      @keyframes pulseOrb {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.15); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes floatCard1 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-6px, -10px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(8px, 10px); }
      }
      .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
      .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
      .flow-line { stroke-dasharray: 8, 8; animation: dashMove 3s linear infinite; }
      .card-1 { animation: floatCard1 6s ease-in-out infinite; }
      .card-2 { animation: floatCard2 7s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Animated Glowing Ambient Lights (in background) -->
  <circle class="orb-1" cx="220" cy="120" r="140" fill="#38bdf8" filter="url(#glow)" />
  <circle class="orb-2" cx="980" cy="260" r="160" fill="#a855f7" filter="url(#glow)" />
  <circle cx="600" cy="380" r="100" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />

  <!-- Dynamic Animated Tech Elements (Safe Background/Sides, never covering text) -->
  <!-- Left Side Data Flow & Server Node -->
  <g class="card-1" opacity="0.75">
    <rect x="70" y="270" width="180" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="95" cy="300" r="6" fill="#10b981" />
    <rect x="110" y="296" width="90" height="8" rx="4" fill="#475569" />
    <circle cx="95" cy="325" r="6" fill="#38bdf8" />
    <rect x="110" y="321" width="120" height="8" rx="4" fill="#334155" />
    <text x="92" y="348" font-family="monospace" font-size="10" fill="#64748b">STATUS: 99.99% SYNC</text>
  </g>

  <!-- Right Side Cloud Node Card -->
  <g class="card-2" opacity="0.75">
    <rect x="950" y="70" width="180" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <path d="M 985 110 C 985 104 990 100 996 100 C 1000 94 1008 90 1016 93 C 1022 90 1030 94 1032 100 C 1038 101 1042 106 1041 112 C 1041 117 1036 122 1030 122 L 995 122 C 989 122 985 117 985 110 Z" fill="url(#primary-grad)" />
    <rect x="1055" y="100" width="60" height="8" rx="4" fill="#475569" />
    <rect x="1055" y="114" width="40" height="6" rx="3" fill="#334155" />
    <text x="975" y="145" font-family="monospace" font-size="10" fill="#38bdf8">E2EE VAULT LOCKED</text>
  </g>

  <!-- Animated Connection Stream / Circuit Lines -->
  <path class="flow-line" d="M 250 315 L 420 315 L 480 350 L 720 350 L 780 315 L 950 315" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.4" />
  <path class="flow-line" d="M 950 115 L 850 115 L 800 80 L 400 80 L 350 115 L 250 115" fill="none" stroke="#a855f7" stroke-width="1.8" opacity="0.3" />

  <!-- Center Foreground Content Container (High Contrast, Clean, Untouchable) -->
  <!-- Top Mini Pill Badge -->
  <g transform="translate(460, 65)">
    <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <circle cx="20" cy="16" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="35" y="21" class="pill-text" fill="#38bdf8">CURATED AWESOME ECOSYSTEM</text>
  </g>

  <!-- Main Title with Gradient Fill -->
  <g transform="translate(600, 160)">
    <text class="title-text" text-anchor="middle">
      <tspan fill="#ffffff">Awesome </tspan>
      <tspan fill="url(#primary-grad)">Document Management</tspan>
    </text>
    <text class="title-text" y="55" text-anchor="middle">
      <tspan fill="#f1f5f9">&amp; Cloud Storage</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <text class="subtitle-text" x="600" y="265" text-anchor="middle">
    Top Enterprise SaaS Platforms, ECM Solutions &amp; Self-Hosted Open-Source Systems
  </text>

  <!-- Feature Tags / Pills at Bottom -->
  <g transform="translate(600, 315)">
    <!-- Pill 1: File Sync -->
    <g transform="translate(-370, 0)">
      <rect width="135" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="67" y="22" class="pill-text" text-anchor="middle">⚡ File Sync</text>
    </g>
    <!-- Pill 2: Self-Hosted -->
    <g transform="translate(-215, 0)">
      <rect width="145" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="72" y="22" class="pill-text" text-anchor="middle">🏠 Self-Hosted</text>
    </g>
    <!-- Pill 3: OCR & Archiving -->
    <g transform="translate(-50, 0)">
      <rect width="165" height="36" rx="18" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="82" y="22" class="pill-text" text-anchor="middle">🔍 OCR &amp; Archival</text>
    </g>
    <!-- Pill 4: Data Governance -->
    <g transform="translate(135, 0)">
      <rect width="165" height="36" rx="18" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="82" y="22" class="pill-text" text-anchor="middle">🛡️ Data Governance</text>
    </g>
    <!-- Pill 5: E2E Encryption -->
    <g transform="translate(320, 0)">
      <rect width="135" height="36" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="67" y="22" class="pill-text" text-anchor="middle">🔐 Zero-Trust</text>
    </g>
  </g>
</svg>
